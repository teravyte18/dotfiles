background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1.0
    brightness = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    rounding = 8
    check_color = rgb(204, 136, 34)
    placeholder_text = Password...
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
